<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>IT PMO — Kanban Board (Demo)</title>
<style>
/* =========================================================
   1. DESIGN TOKENS
   Theme: neon on near-black ("HUD / Sci-Fi" + "Dark Mode OLED"
   with neon accents). Cyan is the primary, magenta the accent.
   Glows are kept subtle so text stays readable (WCAG 4.5:1+).
   ========================================================= */
:root {
  color-scheme: dark;

  /* Neon */
  --neon-cyan: #22d3ee;
  --neon-cyan-hi: #67e8f9;
  --neon-magenta: #ff2bd6;
  --neon-violet: #a78bfa;
  --neon-green: #39ff88;
  --neon-amber: #ffb020;
  --neon-red: #ff3d6e;

  --brand-700: var(--neon-cyan-hi);
  --brand-600: var(--neon-cyan);
  --brand-500: var(--neon-cyan);

  /* Surfaces + text */
  --bg: #05060f;
  --surface: #0c1022;
  --surface-2: #090c1a;
  --column: rgba(12, 16, 34, .72);
  --column-drop: rgba(34, 211, 238, .1);
  --ink: #e6f1ff;
  --ink-2: #c3d3ee;
  --muted: #8fa3c7;
  --line: #1c2547;
  --line-strong: #2a3666;
  --hover: #131a36;
  --chip-bg: rgba(167, 139, 250, .12);
  --chip-ink: #d8ccff;
  --chip-line: rgba(167, 139, 250, .38);
  --avatar-bg: rgba(34, 211, 238, .14);
  --avatar-ink: #7ef2ff;
  --ring: var(--neon-cyan);

  --header-bg: rgba(5, 6, 15, .78);
  --header-ink: #e6f1ff;
  --header-muted: #9fb3d9;
  --header-line: rgba(34, 211, 238, .28);
  --header-ring: var(--neon-magenta);

  /* Status */
  --st-backlog: var(--neon-violet);
  --st-progress: var(--neon-cyan);
  --st-blocked: var(--neon-red);
  --st-done: var(--neon-green);

  /* Priority: stripe / text / background */
  --crit: var(--neon-red);   --crit-ink: #ff8fab; --crit-bg: rgba(255, 61, 110, .14);
  --high: var(--neon-amber); --high-ink: #ffd166; --high-bg: rgba(255, 176, 32, .13);
  --med:  var(--neon-cyan);  --med-ink:  #7ef2ff; --med-bg:  rgba(34, 211, 238, .13);
  --low:  #6b7bb0;           --low-ink:  #b6c3e6; --low-bg:  rgba(107, 123, 176, .16);

  /* Feedback */
  --ok-ink: #7dffb3;   --ok-bg: #08170f;   --ok-line: var(--neon-green);
  --warn-ink: #ffd166; --warn-bg: #1a1306; --warn-line: var(--neon-amber);
  --info-ink: #7ef2ff; --info-bg: #061520; --info-line: var(--neon-cyan);
  --danger-bg: rgba(255, 61, 110, .1); --danger-line: rgba(255, 61, 110, .45);

  --overlay: rgba(2, 3, 10, .78);
  --on-solid: #041018;

  /* Glows */
  --glow-cyan: 0 0 0 1px rgba(34, 211, 238, .45), 0 0 18px -2px rgba(34, 211, 238, .55);
  --glow-magenta: 0 0 0 1px rgba(255, 43, 214, .45), 0 0 18px -2px rgba(255, 43, 214, .5);

  /* Spacing (dense dashboard scale) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --gutter: 24px;

  /* Shape */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-pill: 999px;

  /* Elevation (soft, diffused) */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, .8);
  --shadow-3: 0 24px 60px -12px rgba(0, 0, 0, .85);

  /* Motion */
  --dur-fast: 120ms;
  --dur: 200ms;
  --dur-slow: 260ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);

  /* Type */
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;

  --header-h: 64px;
  --tap: 36px;
}

@media (pointer: coarse) {
  :root { --tap: 44px; }
}

/* =========================================================
   2. BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + var(--sp-4)); }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.icon {
  width: 16px; height: 16px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}
.icon-sm { width: 14px; height: 14px; }
.icon-lg { width: 20px; height: 20px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--tap);
  padding: 0 var(--sp-4);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 14px; font-weight: 600;
  white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.btn:hover { background: var(--hover); border-color: var(--muted); }
.btn:active { box-shadow: inset 0 1px 2px rgba(15, 23, 42, .12); }
.btn-primary {
  background: var(--brand-600); border-color: var(--brand-600); color: var(--on-solid);
  box-shadow: 0 1px 2px rgba(15, 23, 42, .2);
}
.btn-primary:hover { background: var(--brand-700); border-color: var(--brand-700); }
.btn-primary:disabled { background: var(--st-backlog); border-color: var(--st-backlog); cursor: progress; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--hover); border-color: transparent; color: var(--ink); }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap); flex: none;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: transparent; color: var(--muted);
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}

/* =========================================================
   3. APP BAR
   ========================================================= */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--header-bg);
  color: var(--header-ink);
  border-bottom: 1px solid var(--header-line);
}
.app-header :focus-visible { outline-color: var(--header-ring); }
.header-inner {
  display: flex; align-items: center; gap: var(--sp-4);
  min-height: var(--header-h);
  padding: var(--sp-2) var(--gutter);
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: var(--sp-3); margin-right: auto; }
.brand-mark {
  width: 32px; height: 32px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--brand-600);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
}
.brand-mark svg { width: 18px; height: 18px; fill: var(--on-solid); }
.brand-mark svg .accent { fill: var(--neon-magenta); }
.wordmark {
  margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; line-height: 1.2;
  display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap;
}
.wordmark span { font-weight: 400; color: var(--header-muted); font-size: 14px; }

.demo-note {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  margin: 0; padding: var(--sp-1) var(--sp-3);
  font-size: 12.5px; color: var(--header-muted);
  border: 1px solid var(--header-line); border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .04);
  max-width: 560px;
}
.demo-note .icon { color: var(--neon-magenta); }

/* =========================================================
   4. LAYOUT + PAGE HEADING
   ========================================================= */
main {
  max-width: 1600px; margin: 0 auto;
  padding: var(--sp-5) var(--gutter) var(--sp-6);
}
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--sp-4); flex-wrap: wrap;
  margin-bottom: var(--sp-4);
}
.eyebrow {
  margin: 0 0 var(--sp-1);
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
.page-title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }

/* KPI tiles (populated by renderSummary) */
.summary {
  list-style: none; margin: 0 0 var(--sp-4); padding: 0;
  display: grid; gap: var(--sp-3);
  grid-template-columns: minmax(220px, 1.6fr) repeat(5, minmax(120px, 1fr));
}
.kpi {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0;
}
.kpi-label {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.kpi-value {
  font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--dot, var(--st-backlog));
}
.kpi[data-status="Backlog"]     { --dot: var(--st-backlog); }
.kpi[data-status="In Progress"] { --dot: var(--st-progress); }
.kpi[data-status="Blocked"]     { --dot: var(--st-blocked); }
.kpi[data-status="Done"]        { --dot: var(--st-done); }
.kpi-total .kpi-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
.kpi-sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter {
  margin-top: var(--sp-2);
  height: 6px; border-radius: var(--r-pill);
  background: var(--line);
  overflow: hidden;
}
.meter span {
  display: block; height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--brand-600), var(--st-done));
  transition: width var(--dur-slow) var(--ease-out);
}
.kpi-overdue { border-color: var(--danger-line); background: var(--danger-bg); }
.kpi-overdue .kpi-label, .kpi-overdue .kpi-value { color: var(--crit-ink); }
.kpi-overdue.is-zero { border-color: var(--line); background: var(--surface); }
.kpi-overdue.is-zero .kpi-label, .kpi-overdue.is-zero .kpi-value { color: var(--muted); }

/* =========================================================
   5. FILTER TOOLBAR
   ========================================================= */
.filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-3);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-5); box-shadow: var(--shadow-1);
}
.filters h2 {
  display: flex; align-items: center; gap: var(--sp-2);
  margin: 0 var(--sp-2) 0 0; align-self: center;
  font-size: 13px; font-weight: 600; color: var(--ink-2);
}
.filters h2 .icon { color: var(--muted); }
.filter-field { display: flex; flex-direction: column; gap: var(--sp-1); }
.filter-field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.control {
  min-height: var(--tap);
  padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink);
  min-width: 180px;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.control:hover { border-color: var(--muted); }
.control:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent); }
.search-wrap { position: relative; display: flex; align-items: center; }
.search-wrap .icon { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
.search-wrap .control { padding-left: 32px; }
.filter-status {
  margin: 0 0 0 auto; align-self: center;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.filter-status:empty { display: none; }

/* =========================================================
   6. BOARD + COLUMNS
   ========================================================= */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--sp-4);
  align-items: start;
}
.column {
  --col-accent: var(--st-backlog);
  background: var(--column);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  min-height: 280px;
  display: flex; flex-direction: column;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.column[data-status="In Progress"] { --col-accent: var(--st-progress); }
.column[data-status="Blocked"]     { --col-accent: var(--st-blocked); }
.column[data-status="Done"]        { --col-accent: var(--st-done); }
.column.drop-target {
  background: var(--column-drop);
  border-color: var(--brand-500);
  border-style: dashed;
  box-shadow: inset 0 0 0 1px var(--brand-500);
}
.column-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4) var(--sp-2);
  border-top: 3px solid var(--col-accent);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.column-title { min-width: 0; }
.column-header h2 {
  display: flex; align-items: center; gap: var(--sp-2);
  margin: 0; font-size: 14px; font-weight: 700; color: var(--ink);
}
.column-header h2 .dot { --dot: var(--col-accent); }
.column-sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.35; }
.count-badge {
  flex: none;
  min-width: 28px; padding: 1px var(--sp-2);
  border-radius: var(--r-pill);
  background: var(--surface); border: 1px solid var(--line);
  color: var(--ink-2); text-align: center;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.card-list {
  list-style: none; margin: 0; padding: var(--sp-2) var(--sp-3) var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
  flex: 1;
}
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  color: var(--muted); text-align: center;
  padding: var(--sp-6) var(--sp-3); font-size: 13px;
  border: 1px dashed var(--line-strong); border-radius: var(--r-md);
}
.empty .icon { width: 20px; height: 20px; opacity: .8; }

/* =========================================================
   7. CARDS
   ========================================================= */
.card {
  --prio: var(--med);
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-3) var(--sp-3) calc(var(--sp-3) + 3px);
  box-shadow: var(--shadow-1);
  cursor: grab;
  transition: box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
  animation: card-in var(--dur-slow) var(--ease-out);
}
.card::before {
  content: ""; position: absolute; left: 0; top: var(--sp-3); bottom: var(--sp-3);
  width: 3px; border-radius: 0 3px 3px 0; background: var(--prio);
}
.card:hover { box-shadow: var(--shadow-2); border-color: var(--line-strong); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .4; box-shadow: none; }
.card.prio-critical { --prio: var(--crit); }
.card.prio-high     { --prio: var(--high); }
.card.prio-medium   { --prio: var(--med); }
.card.prio-low      { --prio: var(--low); }
@keyframes card-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

.card-top { display: flex; align-items: center; gap: var(--sp-2); }
.task-id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .01em; }
.card-top .icon-btn { margin-left: auto; margin-right: calc(var(--sp-1) * -1); width: 32px; height: 32px; }
.card .icon-btn:hover { background: var(--crit-bg); color: var(--crit-ink); }
.card h3 {
  margin: var(--sp-1) 0 var(--sp-1);
  font-size: 14.5px; font-weight: 650; line-height: 1.35; color: var(--ink);
  overflow-wrap: anywhere;
}
.card-desc {
  margin: 0 0 var(--sp-2); font-size: 13px; color: var(--muted); line-height: 1.45;
  overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-2) 0 0; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: var(--r-pill); padding: 1px var(--sp-2);
  font-size: 11.5px; font-weight: 600; line-height: 1.6;
  border: 1px solid transparent; white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; }
.pill-critical { background: var(--crit-bg); color: var(--crit-ink); --dot: var(--crit); }
.pill-high     { background: var(--high-bg); color: var(--high-ink); --dot: var(--high); }
.pill-medium   { background: var(--med-bg);  color: var(--med-ink);  --dot: var(--med); }
.pill-low      { background: var(--low-bg);  color: var(--low-ink);  --dot: var(--low); }
.tag-cat { background: var(--chip-bg); color: var(--chip-ink); border-color: var(--chip-line); }
.tag-proj { background: transparent; color: var(--ink-2); border-color: var(--line-strong); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag-proj .icon { color: var(--muted); }

.card-foot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
  flex-wrap: wrap;
  margin-top: var(--sp-3); padding-top: var(--sp-2);
  border-top: 1px solid var(--line);
  font-size: 12.5px;
}
.assignee { display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; color: var(--ink-2); font-weight: 500; }
.assignee-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar {
  width: 34px; height: 34px; flex: none;
  display: block;
  border-radius: 50%;
  transition: transform var(--dur) var(--ease-out), filter var(--dur) var(--ease);
}
.avatar svg { display: block; width: 100%; height: 100%; }
.card:hover .avatar { transform: rotate(-6deg) scale(1.08); filter: drop-shadow(0 0 6px rgba(34, 211, 238, .55)); }
.due { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due.is-overdue { color: var(--crit-ink); font-weight: 600; }
.badge-overdue { background: var(--crit-bg); color: var(--crit-ink); border-color: var(--danger-line); }

.card-actions { margin-top: var(--sp-2); display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.move-btn {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  min-height: 30px; padding: 0 var(--sp-2);
  border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm);
  font-size: 12.5px; font-weight: 600; color: var(--brand-700);
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.move-btn .icon { transition: transform var(--dur) var(--ease); }
.move-btn[aria-expanded="true"] .icon { transform: rotate(90deg); }
.move-btn:hover { background: var(--chip-bg); border-color: var(--chip-line); }
@media (pointer: coarse) { .move-btn, .move-menu button, .confirm-delete button { min-height: 44px; } }
.move-menu {
  display: flex; flex-wrap: wrap; gap: var(--sp-1);
  list-style: none; margin: 0; padding: 0; width: 100%;
  animation: fade-in var(--dur) var(--ease-out);
}
.move-menu button {
  min-height: 30px; padding: 0 var(--sp-3);
  border: 1px solid var(--chip-line); background: var(--chip-bg); color: var(--chip-ink);
  border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600;
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.move-menu button:hover { border-color: var(--brand-500); }

.confirm-delete {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  background: var(--danger-bg); border: 1px solid var(--danger-line); border-radius: var(--r-sm);
  padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3);
  font-size: 12.5px; font-weight: 600; color: var(--crit-ink);
  animation: fade-in var(--dur) var(--ease-out);
}
.confirm-delete span { margin-right: auto; }
.confirm-delete button {
  min-height: 28px; padding: 0 var(--sp-3);
  border: 1px solid var(--crit); border-radius: var(--r-sm);
  font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--crit-ink);
}
.confirm-delete .yes { background: var(--crit); color: var(--on-solid); }
.confirm-delete .yes:hover { background: var(--crit-ink); }
@keyframes fade-in {
  from { opacity: 0; transform: translateY(-2px); }
  to   { opacity: 1; transform: none; }
}

/* =========================================================
   8. MODAL + FORM
   ========================================================= */
.modal-backdrop {
  position: fixed; inset: 0; background: var(--overlay);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 8vh var(--sp-4) var(--sp-6); overflow-y: auto; z-index: 50;
  animation: backdrop-in var(--dur) var(--ease);
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  width: 100%; max-width: 640px;
  animation: modal-in var(--dur-slow) var(--ease-out);
}
@keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: none; }
}
.modal-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line);
}
.modal-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
.modal-sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.modal-header .icon-btn { margin: calc(var(--sp-1) * -1) calc(var(--sp-2) * -1) 0 0; }
.modal-header .icon-btn:hover { background: var(--hover); color: var(--ink); }
.task-form { padding: var(--sp-4) var(--sp-5) var(--sp-5); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4) var(--sp-4); }
.form-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.req { color: var(--crit-ink); }
.form-field input, .form-field select, .form-field textarea {
  min-height: 40px; padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); width: 100%;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.form-field input:hover, .form-field select:hover, .form-field textarea:hover { border-color: var(--muted); }
.form-field input:focus-visible, .form-field select:focus-visible, .form-field textarea:focus-visible {
  outline: none; border-color: var(--ring);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent);
}
.form-field textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
.form-field [aria-invalid="true"] { border-color: var(--crit); background: var(--danger-bg); }
.field-foot { display: flex; justify-content: space-between; gap: var(--sp-2); }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 0 auto; font-variant-numeric: tabular-nums; }
.error {
  display: flex; align-items: center; gap: 5px;
  color: var(--crit-ink); font-size: 12.5px; font-weight: 500; margin: 0;
}
.error:empty { display: none; }
.form-actions {
  display: flex; justify-content: flex-end; gap: var(--sp-2);
  margin: var(--sp-5) calc(var(--sp-5) * -1) calc(var(--sp-5) * -1);
  padding: var(--sp-3) var(--sp-5);
  background: var(--surface-2); border-top: 1px solid var(--line);

}

/* =========================================================
   9. TOASTS
   ========================================================= */
.toast-region {
  position: fixed; right: var(--sp-4); bottom: var(--sp-4); z-index: 100;
  display: flex; flex-direction: column; gap: var(--sp-2);

}
.toast {
  display: flex; align-items: flex-start; gap: var(--sp-3);

}

.toast-success { border-left-color: var(--ok-line);   color: var(--ok-ink);   background: var(--ok-bg); }
.toast-warning { border-left-color: var(--warn-line); color: var(--warn-ink); background: var(--warn-bg); }

@keyframes toast-in  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

<!--
  =====================================================================
  FORMSUBMIT CONFIGURATION — READ ME
  FormSubmit (formsubmit.co) needs a ONE-TIME ACTIVATION per email address:
  the very first submission sent to FORMSUBMIT_ENDPOINT triggers a
  confirmation email to that address. Submissions are only delivered after
  someone clicks the activation link in that email. Until then (or while the
  placeholder YOUR_EMAIL@example.com is in place) the call will fail or not
  deliver, and the app shows a non-blocking warning toast — the board keeps
  working regardless.
  Change the email address in ONE place: the FORMSUBMIT_ENDPOINT constant
  at the top of the script below.
  =====================================================================
-->
<script>
"use strict";

/* =========================================================
   CONFIG — swap the email address here (one place only)
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

const STATUSES   = ["Backlog", "In Progress", "Blocked", "Done"];
const PROJECTS   = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on a dependency, vendor or approval",
  "Done": "Completed / closed"
};
const TOAST_MS = 4500;
const FORMSUBMIT_TIMEOUT_MS = 15000;

/** Inline SVG icon paths (24x24 grid, stroked; static markup only). */
const ICONS = {
  trash:    '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>',
  calendar: '<rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
  alert:    '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  chevron:  '<path d="m9 6 6 6-6 6"/>',
  check:    '<circle cx="12" cy="12" r="10"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  info:     '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  folder:   '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  inbox:    '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/>'
};
function icon(name, cls) {
  return '<svg class="icon' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[name] + "</svg>";
}

/* =========================================================
   STATE — single source of truth (in memory only, no storage)
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  ui: { pendingDeleteId: null, openMoveId: null, focusSelector: null }
};
let idCounter = 1;

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatId(n) {
  return "UOB-ITPM-" + String(n).padStart(4, "0");
}

/** Local calendar date as YYYY-MM-DD (avoids UTC off-by-one). */
function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function todayISO() { return toISODate(new Date()); }
function daysFromToday(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return toISODate(d);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function formatDate(iso) {
  const parts = iso.split("-").map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

];

const AV_MOUTHS = [
  '<path d="M17 28.2 Q20 31.2 23 28.2" fill="none" stroke="' + AV_OUTLINE + '" stroke-width="1.7" stroke-linecap="round"/>',

  '<ellipse cx="20" cy="29.2" rx="2" ry="1.7" fill="#3a0d1e" stroke="' + AV_OUTLINE + '" stroke-width="1.2"/>'
];

function hashName(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mixHash(h, salt) {
  let x = Math.imul(h ^ salt, 0x9e3779b1);
  x ^= x >>> 15;
  x = Math.imul(x, 0x85ebca6b);
  x ^= x >>> 13;
  return x >>> 0;
}
function pick(list, h, salt) { return list[mixHash(h, salt) % list.length]; }

/** Returns an inline SVG avatar for a person; purely decorative (aria-hidden). */
function avatarSvg(name) {
  const h = hashName(String(name).trim().toLowerCase());
  const c = { skin: pick(AV_SKIN, h, 1), hair: pick(AV_HAIR, h, 2), ring: pick(AV_RING, h, 3) };
  const top = pick(AV_TOPS, h, 4);
  const eyes = pick(AV_EYES, h, 5);
  const mouth = pick(AV_MOUTHS, h, 6);
  const blush = mixHash(h, 7) % 2 === 0;
  return '<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">' +
    '<circle cx="20" cy="20" r="18.5" fill="#0c1022" stroke="' + c.ring + '" stroke-width="2"/>' +
    '<g stroke="' + AV_OUTLINE + '" stroke-width="1.6" stroke-linejoin="round">' +
      '<path d="M11 36 Q20 30 29 36" fill="' + c.ring + '"/>' +
      '<circle cx="20" cy="23" r="11" fill="' + c.skin + '"/>' +
      top(c) +
    "</g>" +
    eyes(c) +
    (blush ? '<circle cx="13.5" cy="27.2" r="1.7" fill="#ff7aa8" opacity=".6"/><circle cx="26.5" cy="27.2" r="1.7" fill="#ff7aa8" opacity=".6"/>' : "") +
    mouth +
  "</svg>";
}

function optionsHtml(values, selected, placeholder) {
  let html = placeholder != null ? '<option value="">' + escapeHtml(placeholder) + "</option>" : "";
  values.forEach(function (v) {
    html += '<option value="' + escapeHtml(v) + '"' + (v === selected ? " selected" : "") + ">" + escapeHtml(v) + "</option>";
  });
  return html;
}

/* =========================================================
   CORE STATE OPERATIONS
   ========================================================= */
function addTask(data) {
  const task = {
    id: formatId(idCounter++),
    title: data.title,
    description: data.description,
    project: data.project,
    category: data.category,
    assignee: data.assignee,
    priority: data.priority,
    dueDate: data.dueDate,
    status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || STATUSES.indexOf(newStatus) === -1 || task.status === newStatus) return false;
  task.status = newStatus;
  state.ui.openMoveId = null;
  renderBoard();
  return true;
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.ui.pendingDeleteId = null;
  renderBoard();
}

/** Pure: returns the subset of tasks matching the current filters. */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    if (f.project && t.project !== f.project) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (needle && t.assignee.toLowerCase().indexOf(needle) === -1) return false;
    return true;
  });
}

function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = task.priority.toLowerCase();
  const overdue = isOverdue(task);

  let actions;
  if (state.ui.pendingDeleteId === task.id) {
    actions =
      '<div class="confirm-delete" role="group" aria-label="Confirm delete ' + id + '">' +
        "<span>Delete this task?</span>" +
        '<button type="button" class="yes" data-action="delete-yes" data-id="' + id + '">Yes</button>' +
        '<button type="button" data-action="delete-no" data-id="' + id + '">No</button>' +
      "</div>";
  } else {
    const menuOpen = state.ui.openMoveId === task.id;
    actions =
      '<button type="button" class="move-btn" data-action="move-toggle" data-id="' + id + '" aria-expanded="' + menuOpen + '" aria-controls="move-' + id + '">Move' + icon("chevron", "icon-sm") + "</button>";
    if (menuOpen) {
      actions += '<ul class="move-menu" id="move-' + id + '" aria-label="Move ' + id + ' to column">' +
        STATUSES.filter(function (s) { return s !== task.status; }).map(function (s) {
          return '<li><button type="button" data-action="move-to" data-id="' + id + '" data-status="' + escapeHtml(s) + '">' + escapeHtml(s) + "</button></li>";
        }).join("") +
      "</ul>";
    }
  }

  return '<li class="card prio-' + prio + '" draggable="true" data-id="' + id + '" aria-label="' + id + ": " + escapeHtml(task.title) + '">' +
    '<div class="card-top">' +
      '<span class="task-id">' + id + "</span>" +
      '<span class="pill pill-' + prio + '"><span class="dot" aria-hidden="true"></span>' + escapeHtml(task.priority) + '<span class="visually-hidden"> priority</span></span>' +
      '<button type="button" class="icon-btn" data-action="delete" data-id="' + id + '" aria-label="Delete task ' + id + '">' + icon("trash") + "</button>" +
    "</div>" +
    "<h3>" + escapeHtml(task.title) + "</h3>" +
    (task.description ? '<p class="card-desc">' + escapeHtml(task.description) + "</p>" : "") +
    '<div class="tags">' +
      '<span class="pill tag-proj" title="' + escapeHtml(task.project) + '">' + icon("folder", "icon-sm") + '<span class="visually-hidden">Project: </span>' + escapeHtml(task.project) + "</span>" +
      '<span class="pill tag-cat"><span class="visually-hidden">Category: </span>' + escapeHtml(task.category) + "</span>" +
    "</div>" +
    '<div class="card-foot">' +
      '<span class="assignee"><span class="avatar" aria-hidden="true">' + avatarSvg(task.assignee) + '</span><span class="visually-hidden">Assignee: </span><span class="assignee-name">' + escapeHtml(task.assignee) + "</span></span>" +
      '<span class="due' + (overdue ? " is-overdue" : "") + '">' + icon(overdue ? "alert" : "calendar", "icon-sm") +
        '<span class="visually-hidden">Due: </span><time datetime="' + escapeHtml(task.dueDate) + '">' + escapeHtml(formatDate(task.dueDate)) + "</time>" +
        (overdue ? '<span class="pill badge-overdue">Overdue</span>' : "") +
      "</span>" +
    "</div>" +
    '<div class="card-actions">' + actions + "</div>" +
  "</li>";
}

function renderSummary() {
  const counts = {};
  STATUSES.forEach(function (s) { counts[s] = 0; });
  let overdue = 0;
  state.tasks.forEach(function (t) {
    counts[t.status]++;
    if (isOverdue(t)) overdue++;
  });
  const total = state.tasks.length;
  const pct = total ? Math.round((counts.Done / total) * 100) : 0;

  let html =
    '<li class="kpi kpi-total">' +
      '<span class="kpi-label">Total tasks</span>' +
      '<span class="kpi-row"><strong class="kpi-value">' + total + "</strong>" +
      '<span class="kpi-sub">' + pct + "% complete</span></span>" +
      '<span class="meter" aria-hidden="true"><span style="width:' + pct + '%"></span></span>' +
    "</li>";
  STATUSES.forEach(function (s) {
    html += '<li class="kpi" data-status="' + escapeHtml(s) + '">' +
      '<span class="kpi-label"><span class="dot" aria-hidden="true"></span>' + escapeHtml(s) + "</span>" +
      '<strong class="kpi-value">' + counts[s] + "</strong></li>";
  });
  html += '<li class="kpi kpi-overdue' + (overdue ? "" : " is-zero") + '">' +
    '<span class="kpi-label">' + icon("alert", "icon-sm") + "Overdue</span>" +
    '<strong class="kpi-value">' + overdue + "</strong></li>";
  document.getElementById("summary").innerHTML = html;
}

/** Re-renders every column, count badge and the summary strip from state. */
function renderBoard() {
  const visible = applyFilters(state.tasks);

  STATUSES.forEach(function (s) {
    const sid = slug(s);
    const tasks = visible.filter(function (t) { return t.status === s; });
    const list = document.getElementById("list-" + sid);
    list.innerHTML = tasks.length
      ? tasks.map(renderCard).join("")
      : '<li class="empty">' + icon("inbox") + "No tasks</li>";
    const badge = document.getElementById("count-" + sid);
    badge.textContent = tasks.length;
    badge.setAttribute("aria-label", tasks.length + (tasks.length === 1 ? " task" : " tasks"));
  });

  renderSummary();

  const filtered = visible.length !== state.tasks.length;
  document.getElementById("filterStatus").textContent = filtered
    ? "Showing " + visible.length + " of " + state.tasks.length + " tasks"
    : "";

  // Restore keyboard focus after re-render, if requested
  if (state.ui.focusSelector) {
    const el = document.querySelector(state.ui.focusSelector);
    if (el) el.focus();
    state.ui.focusSelector = null;
  }
}

const TOAST_ICONS = { success: "check", warning: "alert", info: "info" };

function showToast(message, type) {
  const kind = type || "info";
  const region = document.getElementById("toastRegion");
  const toast = document.createElement("div");
  toast.className = "toast toast-" + kind;
  toast.innerHTML = icon(TOAST_ICONS[kind] || "info");
  const text = document.createElement("span");
  text.textContent = message;
  toast.appendChild(text);
  region.appendChild(toast);
  setTimeout(function () {
    toast.classList.add("leaving");
    setTimeout(function () { toast.remove(); }, 220);
  }, TOAST_MS);
}

/* =========================================================
   FORMSUBMIT — email notification (AJAX, never navigates)
   ========================================================= */
async function notifyNewTask(task) {
  // Abort after FORMSUBMIT_TIMEOUT_MS so a hung request can't leave the UI in "Sending…"
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, FORMSUBMIT_TIMEOUT_MS);
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    const data = await res.json();
    if (data && String(data.success) === "false") {
      throw new Error(`FormSubmit rejected: ${data.message || "unknown"}`);
    }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

/* =========================================================
   ADD TASK FORM — validation + submit
   ========================================================= */
const FIELDS = {
  title: "fTitle", description: "fDescription", project: "fProject", category: "fCategory",
  assignee: "fAssignee", priority: "fPriority", dueDate: "fDueDate", status: "fStatus"
};

function readForm() {
  const data = {};
  Object.keys(FIELDS).forEach(function (k) {
    data[k] = document.getElementById(FIELDS[k]).value.trim();
  });
  return data;
}

function setFieldError(key, message) {
  const input = document.getElementById(FIELDS[key]);
  const err = document.getElementById("err-" + key);
  if (message) {
    err.innerHTML = icon("alert", "icon-sm");
    err.appendChild(document.createTextNode(message));
    input.setAttribute("aria-invalid", "true");
  } else {
    err.textContent = "";
    input.removeAttribute("aria-invalid");
  }
}

/** Returns { valid, data }; writes inline errors for invalid fields. */
function validateForm() {
  const data = readForm();
  const errors = {};

  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";

  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";

  if (PROJECTS.indexOf(data.project) === -1) errors.project = "Select a project / workstream.";
  if (CATEGORIES.indexOf(data.category) === -1) errors.category = "Select a category.";

  if (!data.assignee) errors.assignee = "Assignee is required.";

  if (PRIORITIES.indexOf(data.priority) === -1) errors.priority = "Select a priority.";

  if (!data.dueDate || !/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Due date is required.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";

  if (STATUSES.indexOf(data.status) === -1) errors.status = "Select a status.";

  let firstInvalid = null;
  Object.keys(FIELDS).forEach(function (k) {
    setFieldError(k, errors[k]);
    if (errors[k] && !firstInvalid) firstInvalid = k;
  });
  if (firstInvalid) document.getElementById(FIELDS[firstInvalid]).focus();

  return { valid: !firstInvalid, data: data };
}

function resetForm() {
  const form = document.getElementById("taskForm");
  form.reset();
  document.getElementById("fPriority").value = "Medium";
  document.getElementById("fStatus").value = "Backlog";
  Object.keys(FIELDS).forEach(function (k) { setFieldError(k, ""); });
  updateCounters();
}

function updateCounters() {
  document.getElementById("cnt-title").textContent = document.getElementById("fTitle").value.length + " / 80";
  document.getElementById("cnt-description").textContent = document.getElementById("fDescription").value.length + " / 500";
}

async function handleSubmit(e) {
  e.preventDefault();
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn.disabled) return;

  const result = validateForm();
  if (!result.valid) return;

  // Optimistic UI: card appears immediately
  const task = addTask(result.data);
  resetForm();
  closeModal();
  showToast("Task " + task.id + " added to " + task.status + ".", "success");

  // Email notification in parallel; failure never breaks the board
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";
  submitBtn.setAttribute("aria-busy", "true");
  try {
    await notifyNewTask(task);
    showToast("Email notification sent for " + task.id + ".", "info");
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warning");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Add Task";
    submitBtn.removeAttribute("aria-busy");
  }
}

/* =========================================================
   MODAL — open/close, Esc, focus trap
   ========================================================= */
let lastFocused = null;

function openModal() {
  lastFocused = document.activeElement;
  document.getElementById("fDueDate").min = todayISO();
  document.getElementById("modalBackdrop").hidden = false;
  document.getElementById("fTitle").focus();
}

function closeModal() {
  document.getElementById("modalBackdrop").hidden = true;
  if (lastFocused && document.body.contains(lastFocused)) lastFocused.focus();
  else document.getElementById("openAddBtn").focus();
}

function handleModalKeydown(e) {
  if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
  if (e.key !== "Tab") return;
  const focusables = document.getElementById("modal").querySelectorAll(
    'button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* =========================================================
   BOARD EVENTS — click actions (delegated)
   ========================================================= */
function handleBoardClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const sel = function (action) { return '[data-action="' + action + '"][data-id="' + id + '"]'; };

  switch (btn.dataset.action) {
    case "move-toggle":
      state.ui.openMoveId = state.ui.openMoveId === id ? null : id;
      state.ui.pendingDeleteId = null;
      state.ui.focusSelector = state.ui.openMoveId ? '#move-' + id + ' button' : sel("move-toggle");
      renderBoard();
      break;
    case "move-to": {
      const target = btn.dataset.status;
      state.ui.focusSelector = sel("move-toggle");
      if (moveTask(id, target)) showToast(id + " moved to " + target + ".", "info");
      break;
    }
    case "delete":
      state.ui.pendingDeleteId = id;
      state.ui.openMoveId = null;
      state.ui.focusSelector = sel("delete-no");
      renderBoard();
      break;
    case "delete-yes":
      deleteTask(id);
      showToast(id + " deleted.", "info");
      break;
    case "delete-no":
      state.ui.pendingDeleteId = null;
      state.ui.focusSelector = sel("delete");
      renderBoard();
      break;
  }
}

/* =========================================================
   DRAG & DROP — native HTML5 API
   ========================================================= */
function handleDragStart(e) {
  const card = e.target.closest && e.target.closest(".card");
  if (!card) return;
  e.dataTransfer.setData("text/plain", card.dataset.id);
  e.dataTransfer.effectAllowed = "move";
  card.classList.add("dragging");
}

function handleDragEnd(e) {
  const card = e.target.closest && e.target.closest(".card");
  if (card) card.classList.remove("dragging");
  document.querySelectorAll(".column.drop-target").forEach(function (c) { c.classList.remove("drop-target"); });
}

function handleDragOver(e) {
  const col = e.target.closest && e.target.closest(".column");
  if (!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  col.classList.add("drop-target");
}

function handleDragLeave(e) {
  const col = e.target.closest && e.target.closest(".column");
  if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
}

function handleDrop(e) {
  const col = e.target.closest && e.target.closest(".column");
  if (!col) return;
  e.preventDefault();
  col.classList.remove("drop-target");
  const id = e.dataTransfer.getData("text/plain");
  const status = col.dataset.status;
  if (id && moveTask(id, status)) showToast(id + " moved to " + status + ".", "info");
}

/* =========================================================
   FILTER EVENTS
   ========================================================= */
function handleFilterChange() {
  state.filters.project = document.getElementById("filterProject").value;
  state.filters.assignee = document.getElementById("filterAssignee").value;
  state.filters.priority = document.getElementById("filterPriority").value;
  renderBoard();
}

function clearFilters() {
  document.getElementById("filterProject").value = "";
  document.getElementById("filterAssignee").value = "";
  document.getElementById("filterPriority").value = "";
  handleFilterChange();
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  // Populate selects from config
  document.getElementById("filterProject").innerHTML = optionsHtml(PROJECTS, "", "All projects");
  document.getElementById("filterPriority").innerHTML = optionsHtml(PRIORITIES, "", "All priorities");
  document.getElementById("fProject").innerHTML = optionsHtml(PROJECTS, "", "Select a project…");
  document.getElementById("fCategory").innerHTML = optionsHtml(CATEGORIES, "", "Select a category…");
  document.getElementById("fPriority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  document.getElementById("fStatus").innerHTML = optionsHtml(STATUSES, "Backlog");

  buildColumns();
  seedTasks();
  renderBoard();

  // Board interactions
  const board = document.getElementById("board");
  board.addEventListener("click", handleBoardClick);
  board.addEventListener("dragstart", handleDragStart);
  board.addEventListener("dragend", handleDragEnd);
  board.addEventListener("dragover", handleDragOver);
  board.addEventListener("dragleave", handleDragLeave);
  board.addEventListener("drop", handleDrop);

  // Filters
  ["filterProject", "filterPriority"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", handleFilterChange);
  });
  document.getElementById("filterAssignee").addEventListener("input", handleFilterChange);
  document.getElementById("clearFiltersBtn").addEventListener("click", clearFilters);

  // Modal + form
  document.getElementById("openAddBtn").addEventListener("click", openModal);
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("cancelBtn").addEventListener("click", function () { resetForm(); closeModal(); });
  document.getElementById("modal").addEventListener("keydown", handleModalKeydown);
  document.getElementById("modalBackdrop").addEventListener("click", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("taskForm").addEventListener("submit", handleSubmit);
  document.getElementById("fTitle").addEventListener("input", updateCounters);
  document.getElementById("fDescription").addEventListener("input", updateCounters);
}

document.addEventListener("DOMContentLoaded", init);
</script>
