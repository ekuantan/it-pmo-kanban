# Static checks for the single-file app. pages.yml deploys only after this passes on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: HTML sanity
        run: |
          set -e
          test -f index.html || { echo "::error::index.html is missing"; exit 1; }
          head -c 15 index.html | grep -qi '^<!DOCTYPE html>' || { echo "::error::index.html must start with <!DOCTYPE html>"; exit 1; }
          for tag in script style; do
            open=$(grep -oiE "<${tag}[ >]" index.html | wc -l)
            close=$(grep -oi "</${tag}>" index.html | wc -l)
            echo "<${tag}>: ${open} open, ${close} close"
            [ "$open" -eq "$close" ] || { echo "::error::Unbalanced <${tag}> tags"; exit 1; }
          done

      - name: Constraint check (no storage, no alert/confirm, no !important)
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie|!important|alert\(|confirm\(' index.html; then
            echo "::error::index.html uses a forbidden API or !important (see CLAUDE.md)"
            exit 1
          fi

      - name: Only allowed URLs are FORMSUBMIT_ENDPOINT and WHATSAPP_URL
        run: |
          # The CSP meta names formsubmit.co in connect-src. WHATSAPP_URL is a link the user clicks, not a fetch. Any other URL fails
          if grep -nE 'https?://' index.html | grep -v 'FORMSUBMIT_ENDPOINT' | grep -v 'const WHATSAPP_URL = ' | grep -v 'connect-src https://formsubmit.co;'; then
            echo "::error::Found a URL other than FORMSUBMIT_ENDPOINT or WHATSAPP_URL"
            exit 1
          fi

      - name: CSP script hash matches the inline script
        run: |
          actual=$(node -e "const s=require('fs').readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);process.stdout.write('sha256-'+require('crypto').createHash('sha256').update(m[1],'utf8').digest('base64'))")
          echo "Inline script hash: ${actual}"
          grep -qF "script-src '${actual}'" index.html || { echo "::error::CSP script-src hash is stale. Set it to '${actual}' (see CLAUDE.md)"; exit 1; }

      - name: No external resources
        run: |
          if grep -niE '<script[^>]+src=|<link[^>]+href=["'"'"']?https?:|@import|<img[^>]+src=["'"'"']?https?:' index.html; then
            echo "::error::External scripts, stylesheets, fonts or images are not allowed"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
